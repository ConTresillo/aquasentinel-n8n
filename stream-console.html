<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaSentinel — Live Agent Stream</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ff6d5a;
    --green: #3fb950;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 860px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type=text] {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #log {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    min-height: 300px;
    max-height: 70vh;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.6;
  }
  .line { margin-bottom: 6px; }
  .dim { color: var(--muted); }
  .tok { color: var(--text); }
  .tool { color: #d2a8ff; font-weight: 600; }
  .badge {
    display: inline-block;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 6px;
    color: var(--muted);
  }
  #status {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 10px;
  }
  .spin { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>AquaSentinel — Live Agent Stream</h1>
  <div class="sub">POST → n8n webhook (<span style="color:var(--accent)">responseMode: streaming</span>) → real agent. Output arrives token-by-token.</div>
  <div class="form-row">
    <input type="text" id="q" placeholder="Ask the agent, e.g. Why is node N02 showing high TDS?" value="Why is node N02 showing high TDS?">
    <button id="go">Stream</button>
  </div>
  <div id="status">Ready.</div>
  <div id="log"></div>
</div>

<script>
const endpoint = 'http://localhost:5678/webhook/aqua-stream';
const qInput = document.getElementById('q');
const goBtn = document.getElementById('go');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

function append(text, cls) {
  const d = document.createElement('div');
  d.className = 'line ' + (cls || '');
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}

async function stream() {
  const question = qInput.value.trim();
  if (!question) return;
  logEl.innerHTML = '';
  goBtn.disabled = true;
  statusEl.textContent = 'Connecting to webhook…';
  try {
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!resp.ok) {
      statusEl.textContent = 'HTTP ' + resp.status + ' — ' + (await resp.text()).slice(0, 300);
      return;
    }
    statusEl.textContent = 'Streaming… (chunks arrive live)';
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let tokens = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let chunk;
        try { chunk = JSON.parse(line); } catch (e) { append('raw: ' + line.slice(0, 120), 'dim'); continue; }
        const type = chunk.type;
        const content = chunk.content || '';
        if (type === 'begin') {
          append('▸ execution began', 'dim');
        } else if (type === 'item') {
          tokens++;
          const d = append(content, 'tok');
          (function (el) { el.classList.add('tok'); })(d);
        } else if (type === 'tool-call-start') {
          append('▸ TOOL CALL: ' + content, 'tool');
        } else if (type === 'tool-call-end') {
          append('▸ tool returned', 'dim');
        } else if (type === 'end') {
          statusEl.textContent = 'Done — ' + tokens + ' token chunks streamed.';
        } else {
          append('[' + type + '] ' + String(content).slice(0, 120), 'dim');
        }
      }
    }
    if (!/Done/.test(statusEl.textContent)) {
      statusEl.textContent = 'Stream finished.';
    }
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    goBtn.disabled = false;
  }
}

goBtn.addEventListener('click', stream);
qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') stream(); });
</script>
</body>
</html>
